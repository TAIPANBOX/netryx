<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="netryx: the home network console that runs on the OpenWrt router itself">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a0e16"/><stop offset="0.55" stop-color="#0d1117"/><stop offset="1" stop-color="#101826"/>
  </linearGradient>
  <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4493f8"/><stop offset="0.6" stop-color="#2dd4bf"/><stop offset="1" stop-color="#e3b341"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4493f8"/><stop offset="1" stop-color="#e3b341"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#161b22" stroke-width="1"/>
  </pattern>
  <radialGradient id="halo" cx="0.22" cy="0.42" r="0.6">
    <stop offset="0" stop-color="#4493f8" stop-opacity="0.16"/><stop offset="1" stop-color="#4493f8" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1280" height="340" fill="url(#bg)"/>
<rect width="1280" height="340" fill="url(#grid)" opacity="0.6"/>
<rect width="1280" height="340" fill="url(#halo)"/>
<rect width="1280" height="4" fill="url(#accent)"/>

<!-- traffic chart: down above the axis in blue, up below it in amber -->
<g transform="translate(980,170)">
  <rect x="-40" y="-110" width="300" height="220" rx="14" fill="#141a23" stroke="#1b2331"/>
  <line x1="-22" y1="0" x2="242" y2="0" stroke="#283341" stroke-width="1.5"/>
  <path d="M -22 0 L -22 -40 L 10 -46 L 30 -70 L 60 -64 L 90 -82 L 120 -60 L 150 -76 L 180 -50 L 210 -66 L 242 -58 L 242 0 Z" fill="#4493f8" opacity="0.9"/>
  <path d="M -22 0 L -22 -22 L 10 -26 L 30 -40 L 60 -34 L 90 -46 L 120 -30 L 150 -42 L 180 -26 L 210 -36 L 242 -30 L 242 0 Z" fill="#79b8ff" opacity="0.9"/>
  <path d="M -22 0 L -22 14 L 30 18 L 60 30 L 90 22 L 120 34 L 150 20 L 180 28 L 242 22 L 242 0 Z" fill="#e3a33b" opacity="0.9"/>
  <text x="-22" y="-86" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#69788b">WAN traffic, by client</text>
  <circle cx="-16" cy="84" r="4" fill="#4493f8"/><text x="-6" y="88" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#9aa7b8">TV</text>
  <circle cx="34" cy="84" r="4" fill="#79b8ff"/><text x="44" y="88" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#9aa7b8">laptop</text>
  <circle cx="104" cy="84" r="4" fill="#e3a33b"/><text x="114" y="88" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#9aa7b8">up</text>
</g>

<!-- wordmark -->
<text x="72" y="136" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif" font-size="66" font-weight="700" letter-spacing="-1.5" fill="url(#wordmark)">netryx</text>

<text x="74" y="178" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" fill="#e6edf3">Which device went where, and what to do about it. <tspan font-weight="600" fill="#2dd4bf">On the router itself.</tspan></text>
<text x="74" y="206" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#69788b">A Go service for OpenWrt: a console, rules, quarantine and alerts. No cloud, no telemetry.</text>

<!-- three facts -->
<g transform="translate(72,240)">
  <rect x="0" y="0" width="250" height="62" rx="10" fill="#141a23" stroke="#1b2331"/>
  <text x="18" y="26" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" letter-spacing="0.6" fill="#69788b">COPIES</text>
  <text x="18" y="48" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">0.011% of the bytes</text>

  <rect x="270" y="0" width="250" height="62" rx="10" fill="#141a23" stroke="#1b2331"/>
  <text x="288" y="26" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" letter-spacing="0.6" fill="#69788b">RUNS ON</text>
  <text x="288" y="48" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">OpenWrt 25.12</text>

  <rect x="540" y="0" width="250" height="62" rx="10" fill="#141a23" stroke="#1b2331"/>
  <text x="558" y="26" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" letter-spacing="0.6" fill="#69788b">FETCHES</text>
  <text x="558" y="48" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600" fill="#2dd4bf">nothing from outside</text>
</g>
</svg>
